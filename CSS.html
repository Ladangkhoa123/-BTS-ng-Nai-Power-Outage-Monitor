<style>
:root{--ink:#172331;--muted:#718096;--line:#e8edf2;--blue:#1769e0;--navy:#102b4e;--bg:#f5f8fb;--green:#0c9b70;--amber:#c67b00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,Segoe UI,Arial,sans-serif;display:flex}.sidebar{width:240px;min-height:100vh;background:var(--navy);color:#fff;padding:25px 18px;display:flex;flex-direction:column}.brand{display:flex;gap:11px;align-items:center;margin:0 10px 48px}.brand-mark{background:#ffbf3f;color:#132846;border-radius:10px;padding:8px;font-size:18px}.brand b{display:block;font-size:16px}.brand small{color:#9bb0ca;font-size:11px}.sidebar nav a{display:block;color:#b8c8dc;text-decoration:none;padding:13px 14px;border-radius:8px;margin:5px 0}.sidebar nav a.active,.sidebar nav a:hover{background:#21466f;color:#fff}.sidebar-foot{margin-top:auto;color:#9bb0ca;line-height:1.8;font-size:11px}.main{padding:32px 42px;max-width:1500px;width:calc(100% - 240px)}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--blue);font-weight:700}.topbar h1{font-size:25px;margin:7px 0 0}.actions{display:flex;gap:10px}.button{border:0;border-radius:7px;padding:11px 15px;font-weight:600;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:17px}.stat label{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:25px;margin-top:11px}.stat small{color:var(--muted);font-size:11px}.toolbar{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px;display:flex;gap:10px;margin-bottom:18px}.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:0 10px;flex:1}.search input{border:0;outline:0;paddi s{grid-template-columns:repeat(2,1fr)}.actions{width:100%}.actions button{flex:1}.toolbar select,.toolbar input[type=date]{flex:1}}
.station-code{color:var(--blue);font-size:11px;font-weight:700;margin-left:5px;white-space:nowrap}
</style>
<style>

.filter-title{color:#1769e0;font-weight:800;letter-spacing:.5px}.filter-head>span{font-size:10px;font-weight:800;color:#526174;background:#f6f8fa;border-radius:12px;padding:5px 9px}
.filter-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.filter-pill{border:1px solid #dfe7f0;background:#f5f8fb;color:#5a6878;border-radius:22px;padding:9px 16px;font-weight:700;cursor:pointer}.filter-pill.active{background:#1769e0;color:#fff;border-color:#1769e0;box-shadow:0 3px 8px #1769e044}.filter-pill:nth-child(2){color:#9a3440}.filter-pill:nth-child(3),.filter-pill:nth-child(4){color:#6b7481}
