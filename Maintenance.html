<!DOCTYPE html>
<html lang="vi">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hệ thống đang bảo trì</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    body {
      align-items: center;
      background: #f4f7fb;
      color: #1f2937;
      display: flex;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, .08);
      max-width: 560px;
      padding: 48px 32px;
      text-align: center;
      width: 100%;
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { color: #64748b; line-height: 1.6; margin: 0; }
    .copyright {
      border-top: 1px solid #e5e7eb;
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.8;
      margin-top: 28px;
      padding-top: 20px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">🛠️</div>
    <h1>Hệ thống đang bảo trì</h1>
    <p><?= CONFIG.MAINTENANCE_MESSAGE ?></p>
    <div class="copyright">
      © 2026 BTS Đồng Nai Power Monitor. All Rights Reserved.<br>
      Bản quyền thuộc về La Đăng Khoa người phát triển hệ thống.<br>
      Unauthorized copying or redistribution is prohibited.
    </div>
  </main>
</body>
</html>
